name: 功能建议
description: 提议一个新功能或使用体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。好的功能建议通常从一个明确的问题开始。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个问题在什么场景下出现，会给用户带来什么困扰？
      placeholder: 当我想要……时，目前只能……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 请描述你希望 Readme Doctor 如何解决它。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你是否考虑过其他实现方式或替代工具？

  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - README 检查规则
        - 评分与建议
        - 页面与交互
        - 国际化
        - 分享与导出
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同建议。
          required: true
        - label: 这个建议与 Readme Doctor 的目标有关。
          required: true
